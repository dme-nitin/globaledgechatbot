<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heena Chat Widget</title>
<style>
  :root{
    --ink:#0f2436;
    --navy:#0c4a6e;
    --navy-deep:#082f49;
    --sky:#0ea5e9;
    --sky-light:#38bdf8;
    --sky-deep:#0284c7;
    --cloud:#f0f9ff;
    --line:#dceefb;
    --text-soft:#5b7185;
    --white:#ffffff;
    --radius:1.25rem;
    --font-display: 'Plus Jakarta Sans', 'Segoe UI', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
    --font-body: 'Inter', 'Segoe UI', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  }
  *{box-sizing:border-box;}
  html{ font-size:16px; } /* fixed rem baseline so browser zoom scales everything uniformly, not device-dependent */
  body{margin:0;font-family:system-ui, -apple-system, var(--font-body), 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;}

  /* ---------- Launcher + permanent label wrapper ---------- */
  #heena-launcher-wrap{
    position:fixed;
    bottom:max(1rem, env(safe-area-inset-bottom, 0px) + 1rem);
    right:max(1rem, env(safe-area-inset-right, 0px) + 1rem);
    display:flex; align-items:center; gap:0.625rem;
    z-index:99998;
  }

  /* ---------- Floating Launcher (3D sky-blue) ---------- */
  #heena-launcher{
    position:relative; flex-shrink:0;
    width:40px; height:40px; border-radius:50%;
    background:linear-gradient(150deg, var(--sky-light) 0%, var(--sky) 55%, var(--sky-deep) 100%);
    box-shadow:
      0 0.875rem 1.875rem rgba(2,132,199,0.42),
      inset 0 0.125rem 0.1875rem rgba(255,255,255,0.55),
      inset 0 -0.25rem 0.375rem rgba(2,60,90,0.35);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; border:none;
    transition:transform .2s ease;
    animation:heena-glow 2.6s ease-in-out infinite;
  }
  #heena-launcher:hover{ transform:scale(1.08) translateY(-0.125rem); }
  #heena-launcher svg{ width:17px; height:17px; }
  #heena-launcher .dot{
    position:absolute; top:0.0625rem; right:0.0625rem; width:0.8125rem;height:0.8125rem;
    background:#22c55e; border:0.15625rem solid var(--white); border-radius:50%;
    box-shadow:0 0 0 0.125rem rgba(34,197,94,0.25);
  }
  @keyframes heena-glow{
    0%,100%{ box-shadow:0 0.875rem 1.875rem rgba(2,132,199,0.42), inset 0 0.125rem 0.1875rem rgba(255,255,255,0.55), inset 0 -0.25rem 0.375rem rgba(2,60,90,0.35); }
    50%{ box-shadow:0 0.875rem 2.375rem rgba(14,165,233,0.62), inset 0 0.125rem 0.1875rem rgba(255,255,255,0.55), inset 0 -0.25rem 0.375rem rgba(2,60,90,0.35); }
  }

  /* ---------- Permanent "Chat with us" label (no hover behaviour) ---------- */
  #heena-teaser{
    background:var(--white); color:var(--ink); font-family:var(--font-display);
    font-weight:600; font-size:15px; padding:0.5rem 0.70rem; border-radius:0.875rem;
    box-shadow:0 0.625rem 1.625rem rgba(15,36,54,0.16); display:flex; align-items:center; gap:0.625rem;
    width:max-content; max-width:min(14rem, 45vw); flex-shrink:1;
  }
  #heena-teaser span{
    flex:1; min-width:0; white-space:normal; word-break:normal; overflow-wrap:normal;
    line-height:1.4;
  }

  /* ---------- Chat Panel ---------- */
  #heena-panel{
    position:fixed;
    bottom:calc(max(1rem, env(safe-area-inset-bottom, 0px) + 1rem) + 4.5rem);
    right:max(1rem, env(safe-area-inset-right, 0px) + 1rem);
    left:auto;
    width:min(24rem, calc(100vw - 2rem));
    height:min(33.75rem, calc(100vh - 7rem));
    height:min(33.75rem, calc(100dvh - 7rem)); /* dvh: correctly accounts for mobile browser toolbars */
    background:var(--white); border-radius:var(--radius);
    box-shadow:0 1.625rem 4rem rgba(8,47,73,0.28);
    display:none; flex-direction:column; overflow:hidden;
    z-index:99999; font-family:var(--font-body);
    border:1px solid var(--line);
    transform-origin:bottom right;
  }
  #heena-panel.open{ display:flex; animation:heena-rise .32s cubic-bezier(.2,.8,.3,1); }
  @keyframes heena-rise{ from{opacity:0; transform:translateY(1.5rem) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }

  /* ---------- Header ---------- */
  .heena-header{
    background:linear-gradient(120deg, var(--navy-deep), var(--sky-deep));
    padding:1rem 1.125rem; display:flex; align-items:center; gap:0.75rem; color:var(--white);
    flex-shrink:0;
  }
  .heena-avatar{
    width:2.5rem;height:2.5rem;border-radius:50%;
    background:linear-gradient(150deg, var(--sky-light), var(--sky-deep));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:1rem;
    flex-shrink:0;
  }
  .heena-header-text{ flex:1; min-width:0; }
  .heena-header-text .name{ font-family:var(--font-display); font-weight:700; font-size:0.9375rem; display:flex; align-items:center; }
  .heena-header-text .name .online-dot{
    width:0.5rem; height:0.5rem; background-color:#22c55e; border-radius:50%;
    display:inline-block; margin-right:0.4375rem; flex-shrink:0;
    box-shadow:0 0 0 0.125rem rgba(34,197,94,0.25);
  }
  .heena-header-text .status{ font-size:0.75rem; opacity:.85; display:flex; align-items:center; gap:0.3125rem; margin-top:0.125rem;}
  .heena-header-text .status .dot{ width:0.4375rem;height:0.4375rem;background:#4ade80;border-radius:50%; }
  .heena-close{ cursor:pointer; opacity:.75; background:none;border:none;color:var(--white); display:flex; align-items:center; justify-content:center; padding:0.125rem; flex-shrink:0; }
  .heena-close svg{ width:1rem; height:1rem; }
  .heena-close:hover{ opacity:1; }

  /* ---------- Chat Screen ---------- */
  #heena-chat-screen{ flex:1; display:flex; flex-direction:column; min-height:0; }
  #heena-messages{
    flex:1; overflow-y:auto; padding:1rem; background:var(--cloud);
    display:flex; flex-direction:column; gap:0.625rem;
  }
  .heena-msg{ max-width:78%; padding:0.625rem 0.8125rem; border-radius:0.875rem; font-size:0.85rem; line-height:1.45; white-space:pre-line; }
  .heena-msg.bot{
    background:var(--white); color:var(--ink); align-self:flex-start; border-bottom-left-radius:0.25rem;
    box-shadow:0 0.0625rem 0.1875rem rgba(18,35,61,0.08);
  }
  .heena-msg.user{
    background:linear-gradient(120deg, var(--sky), var(--sky-deep)); color:var(--white);
    align-self:flex-end; border-bottom-right-radius:0.25rem;
    display:flex; align-items:flex-end; gap:0.375rem; flex-wrap:wrap;
  }
  .heena-msg.user .ticks{
    display:inline-flex; align-items:center; flex-shrink:0; color:rgba(255,255,255,0.65);
    transition:color .25s ease;
  }
  .heena-msg.user .ticks svg{ width:0.9375rem; height:0.9375rem; display:block; }
  .heena-msg.user .ticks.read{ color:#34B7F1; }
  .heena-typing{ align-self:flex-start; display:flex; align-items:center; gap:0.5rem; padding:0.6875rem 0.875rem; background:var(--white);
    border-radius:0.875rem; border-bottom-left-radius:0.25rem; box-shadow:0 0.0625rem 0.1875rem rgba(18,35,61,0.08);
    font-size:0.75rem; color:var(--text-soft); }
  .heena-typing .heena-dots{ display:flex; gap:0.25rem; }
  .heena-typing .heena-dots span{ width:0.375rem;height:0.375rem;background:#9db8c9;border-radius:50%; animation:heena-bounce 1.2s infinite; }
  .heena-typing .heena-dots span:nth-child(2){ animation-delay:.15s; }
  .heena-typing .heena-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes heena-bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5;} 30%{ transform:translateY(-0.25rem); opacity:1;} }

  #heena-input-row{
    display:flex; gap:0.5rem; padding:0.75rem; border-top:1px solid var(--line); background:var(--white); flex-shrink:0;
  }
  #heena-input{
    flex:1; min-width:0; border:1.5px solid var(--line); border-radius:1.375rem; padding:0.625rem 0.9375rem;
    font-size:1rem; /* 16px minimum prevents iOS Safari auto-zoom on focus */
    outline:none; font-family:var(--font-body);
  }
  #heena-input:focus{ border-color:var(--sky); }
  #heena-send{
    width:2.625rem;height:2.625rem;border-radius:50%; border:none; flex-shrink:0;
    background:linear-gradient(150deg, var(--sky-light), var(--sky-deep)); color:var(--white); cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0.375rem 1rem rgba(2,132,199,0.35);
  }
  #heena-send svg{ width:1.0625rem;height:1.0625rem; }

  /* ---------- Responsive breakpoints ---------- */
  /* Tablet */
  @media (max-width:768px){
    #heena-panel{ width:min(26rem, calc(100vw - 1.5rem)); }
  }
  /* Mobile phones */
  @media (max-width:480px){
    #heena-launcher-wrap{ bottom:max(0.75rem, env(safe-area-inset-bottom, 0px) + 0.75rem); right:max(0.75rem, env(safe-area-inset-right, 0px) + 0.75rem); }
    #heena-panel{
      right:max(0.5rem, env(safe-area-inset-right, 0px) + 0.5rem);
      left:max(0.5rem, env(safe-area-inset-left, 0px) + 0.5rem);
      bottom:calc(max(0.75rem, env(safe-area-inset-bottom, 0px) + 0.75rem) + 4rem);
      width:auto;
      height:min(38rem, calc(100vh - 6rem));
      height:min(38rem, calc(100dvh - 6rem));
    }
    #heena-teaser{ max-width:40vw; padding:0.5rem 0.70rem; font-size:15px; }
    #heena-launcher{ width:40px; height:40px; }
    #heena-launcher svg{ width:17px; height:17px; }
  }
  /* Very small phones (older iPhones / narrow Android) */
  @media (max-width:340px){
    #heena-teaser span{ display:none; } /* icon-only label to avoid crowding on very narrow screens */
    #heena-teaser{ padding:0.625rem; }
  }
  /* Large desktop monitors */
  @media (min-width:1440px){
    #heena-panel{ width:min(26rem, calc(100vw - 2rem)); height:min(36rem, calc(100vh - 7rem)); height:min(36rem, calc(100dvh - 7rem)); }
  }
</style>
</head>
<body>

<!-- Launcher + permanent "Chat with us" label -->
<div id="heena-launcher-wrap">
  <div id="heena-teaser">
    <span>Chat with us</span>
  </div>

  <button id="heena-launcher" aria-label="Open chat">
    <span class="dot"></span>
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<!-- Chat Panel -->
<div id="heena-panel">
  <div class="heena-header">
    <div class="heena-avatar">H</div>
    <div class="heena-header-text">
      <div class="name"><span class="online-dot"></span>Heena is Online</div>
    </div>
    <button class="heena-close" id="heena-close-btn" aria-label="Close chat">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Chat Interface (opens directly, no pre-chat form) -->
  <div id="heena-chat-screen">
    <div id="heena-messages"></div>
    <div id="heena-input-row">
      <input type="text" id="heena-input" placeholder="Tell me your query...">
      <button id="heena-send" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 20l18-8L3 4v6l12 2-12 2v6z" fill="white"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- FAQ training data (edit faq-data.js to add more Q&A) -->
<script src="faq-data.js"></script>

<script>
/**
 * ============================================================
 *  HEENA CHATBOT — WIDGET LOGIC
 * ============================================================
 * IMPORTANT: replace APPS_SCRIPT_URL below with your deployed
 * Google Apps Script Web App URL (see SETUP_INSTRUCTIONS.md)
 * ============================================================
 */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8aVAKKmYSYzhrPnAIXMxfJ68oOAecCN-2uhwE7zhR3irvQsNPdrexcy7stenKbshYlg/exec";

// Diagnostic check: if faq-data.js failed to load (wrong path, 404, blocked
// script, hosting misconfiguration), FAQ_DATA won't exist. The guided
// question flow still works fine without it (see safeFaqData() below), but
// warn loudly in the console so this is easy to spot and fix during setup.
if (typeof FAQ_DATA === 'undefined') {
  console.warn(
    'Heena chatbot: faq-data.js did not load (FAQ_DATA is undefined). ' +
    'Make sure faq-data.js is uploaded in the SAME folder as chatbot-widget.html ' +
    'and is reachable at the exact same path. The guided question flow will still ' +
    'work, but knowledge-base answers will use a generic fallback until this is fixed.'
  );
}

const launcher = document.getElementById('heena-launcher');
const panel = document.getElementById('heena-panel');
const closeBtn = document.getElementById('heena-close-btn');
const chatScreen = document.getElementById('heena-chat-screen');
const messagesEl = document.getElementById('heena-messages');
const inputEl = document.getElementById('heena-input');
const sendBtn = document.getElementById('heena-send');
const teaser = document.getElementById('heena-teaser');

// No pre-chat form anymore, so there's no name/mobile/email to key Google Sheet rows by.
// conversationLog is still tracked below; wire this up to however you capture contact
// details now (e.g. a "leave your number" prompt) if you want chats saved to the Sheet again.
let userInfo = { name: "", mobile: "", email: "" };
let conversationLog = [];

// ---------- Guided Qualification Flow ----------
// Step-by-step counsellor questions. Edit the text here to change wording.
const FLOW_QUESTIONS = {
  country: "Which country are you looking for?",
  course: "Which course are you looking for?",
  name: "By the way, may I know your name? \u{1F60A}",
  timeline: "How soon are you planning to go abroad? (This year, next year, or a specific intake?)",
  education: "What is your highest educational qualification, and which stream did you study?",
  percentage: "What percentage or CGPA did you score in that?",
  english: "Have you taken any English language proficiency test (IELTS, PTE, TOEFL, Duolingo, etc.)? If yes, what was your score?",
  budget: "Could you share your approximate budget for overseas education?",
  scheduleOffer: "Would you like to schedule a counselling call with one of our experts?",
  scheduleTime: "Great! What would be a convenient date and time for the call?",
  askMobile: "Could you please share your mobile number so our counsellor can assist you better if required?",
  clarifyTimeline: "No worries! Just to understand better - are you looking at this year, next year, or a specific intake (like Fall/Spring)?"
};

// ---------- Destination Recognition ----------
// Comprehensive country list — used to recognise a destination naturally from
// the user's own words. This list is intentionally broad, but note it can
// NEVER be fully exhaustive of "every place on Earth" — see detectLocation()
// below, which always falls back to accepting whatever the student typed
// (title-cased) even if it isn't in this list, so a valid destination is
// never rejected just because it's missing here.
const COUNTRY_LIST = [
  "ireland","canada","united kingdom","germany","dubai","australia",
  "united states","france","italy","spain","poland","netherlands","new zealand",
  "sweden","norway","finland","denmark","switzerland","austria","belgium","portugal",
  "malta","cyprus","czech republic","hungary","lithuania","latvia","estonia","romania",
  "croatia","slovenia","slovakia","greece","united arab emirates","qatar","oman",
  "bahrain","kuwait","saudi arabia","singapore","malaysia","japan","south korea",
  "china","hong kong","england","scotland","wales","northern ireland","russia",
  "turkey","israel","south africa","brazil","mexico","argentina","thailand","vietnam",
  "indonesia","philippines","egypt","nigeria","kenya"
];

// Common abbreviations / short forms mapped to their full country name.
const COUNTRY_ABBREVIATIONS = {
  "usa":"United States", "u.s.a":"United States", "us":"United States", "america":"United States",
  "uk":"United Kingdom", "u.k":"United Kingdom", "gb":"United Kingdom", "britain":"United Kingdom",
  "uae":"United Arab Emirates", "u.a.e":"United Arab Emirates", "nz":"New Zealand"
};

// Well-known cities mapped to their country — so "Dublin" is understood as Ireland, etc.
// Add more cities here anytime; no need to touch any other logic.
const CITY_TO_COUNTRY = {
  "dublin":"Ireland", "cork":"Ireland", "galway":"Ireland",
  "vancouver":"Canada", "toronto":"Canada", "montreal":"Canada", "calgary":"Canada", "ottawa":"Canada",
  "london":"United Kingdom", "manchester":"United Kingdom", "birmingham":"United Kingdom",
  "glasgow":"United Kingdom", "edinburgh":"United Kingdom", "liverpool":"United Kingdom",
  "sydney":"Australia", "melbourne":"Australia", "brisbane":"Australia", "perth":"Australia", "adelaide":"Australia",
  "auckland":"New Zealand", "wellington":"New Zealand", "christchurch":"New Zealand",
  "dubai":"United Arab Emirates", "abu dhabi":"United Arab Emirates", "sharjah":"United Arab Emirates",
  "berlin":"Germany", "munich":"Germany", "frankfurt":"Germany", "hamburg":"Germany",
  "california":"United States", "new york":"United States", "boston":"United States", "chicago":"United States",
  "paris":"France", "milan":"Italy", "rome":"Italy", "madrid":"Spain", "barcelona":"Spain",
  "amsterdam":"Netherlands", "warsaw":"Poland", "singapore city":"Singapore"
};

// Add more course names/keywords here as needed — used to recognise a course
// naturally if the student mentions it in an earlier answer.
const KNOWN_COURSES = [
  "mba","bba","bca","b.tech","btech","m.tech","mtech","bsc","b.sc","msc","m.sc","engineering",
  "computer science","data science","business analytics","artificial intelligence","cyber security",
  "nursing","hospitality","hotel management","law","llb","medicine","mbbs","pharmacy","phd","diploma",
  "masters","master's","bachelor","bachelors","undergraduate","postgraduate","finance","marketing",
  "accounting","psychology","architecture","fintech","health science"
];

// Words/phrases that indicate a clear, specific timeline answer.
const CLEAR_TIMELINE_HINTS = [
  "this year","next year","2025","2026","2027","intake","jan","feb","mar","apr","may","jun",
  "jul","aug","sep","oct","nov","dec","month","fall","spring","summer","winter"
];

const POSITIVE_WORDS = ["yes","yeah","yep","yup","sure","ok","okay","definitely","please","haan","chalo","of course"];
const NEGATIVE_WORDS = ["no","nah","not now","nahi","later","not interested","maybe later"];

let flowStep = "INITIAL"; // waits for the student's first message before asking anything
let flowDone = false;     // once true, free-form FAQ/knowledge-base matching takes over
let leadAnswers = {
  country:"", course:"", timeline:"", education:"", percentage:"",
  englishTest:"", budget:"", name:"", mobile:"", callTime:""
};

// Strips punctuation and collapses extra whitespace so "  Ireland!!" or
// "ireland." both normalize to "ireland" before we try to match anything.
function normalizeText(text) {
  return (text || "")
    .toLowerCase()
    .replace(/[.,!?;:'"()]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function formatLocation(loc) {
  return loc.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1));
}

// Tiny Levenshtein (edit-distance) implementation — used to tolerate small
// spelling mistakes (e.g. "Irelnad", "Austrailia") when matching country names.
function editDistance(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = a[i - 1] === b[j - 1]
        ? dp[i - 1][j - 1]
        : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[a.length][b.length];
}

// Flexible destination recognition: tries city mapping, abbreviations, exact
// country match, then a fuzzy (typo-tolerant) match — in that order. Returns
// a properly-formatted country/city name, or null if nothing matched (the
// caller then just accepts the student's own wording rather than rejecting it).
function detectLocation(text) {
  const norm = normalizeText(text);
  if (!norm) return null;

  // 1. Known city → country mapping (checked as whole-word matches)
  for (const city in CITY_TO_COUNTRY) {
    if (new RegExp(`\\b${city}\\b`).test(norm)) return CITY_TO_COUNTRY[city];
  }

  // 2. Common abbreviations (whole-word match, so "us" doesn't match inside "australia")
  for (const abbr in COUNTRY_ABBREVIATIONS) {
    if (new RegExp(`\\b${abbr}\\b`).test(norm)) return COUNTRY_ABBREVIATIONS[abbr];
  }

  // 3. Exact substring match against the full country list (longest name first,
  //    so "Northern Ireland" is matched in full instead of just "Ireland")
  const sortedByLength = [...COUNTRY_LIST].sort((a, b) => b.length - a.length);
  const exact = sortedByLength.find(c => norm.includes(c));
  if (exact) return formatLocation(exact);

  // 4. Fuzzy match to tolerate minor typos (only for single/double-word answers,
  //    so we don't accidentally fuzzy-match a whole sentence)
  const words = norm.split(" ");
  if (words.length <= 3) {
    let bestMatch = null, bestDistance = Infinity;
    COUNTRY_LIST.forEach(country => {
      const dist = editDistance(norm, country);
      const threshold = country.length <= 6 ? 1 : 2;
      if (dist <= threshold && dist < bestDistance) { bestDistance = dist; bestMatch = country; }
    });
    if (bestMatch) return formatLocation(bestMatch);
  }

  // 5. No match found in our lists — don't reject it, just accept the
  //    student's own wording as the destination (nicely capitalized).
  return null;
}

function detectCourse(text) {
  const low = (text || "").toLowerCase();
  return KNOWN_COURSES.find(c => low.includes(c)) || null;
}

// Display-friendly names for course abbreviations (kept uppercase); everything
// else falls back to Title Case.
const COURSE_DISPLAY_NAMES = {
  "mba":"MBA", "bba":"BBA", "bca":"BCA", "b.tech":"B.Tech", "btech":"B.Tech",
  "m.tech":"M.Tech", "mtech":"M.Tech", "bsc":"BSc", "b.sc":"B.Sc", "msc":"MSc",
  "m.sc":"M.Sc", "mbbs":"MBBS", "llb":"LLB", "phd":"PhD"
};
function formatCourse(course) {
  if (COURSE_DISPLAY_NAMES[course]) return COURSE_DISPLAY_NAMES[course];
  return course.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1));
}

function isTimelineClear(text) {
  const low = (text || "").toLowerCase();
  return CLEAR_TIMELINE_HINTS.some(h => low.includes(h));
}
function isAffirmative(text) {
  const low = (text || "").toLowerCase();
  if (NEGATIVE_WORDS.some(w => low.includes(w))) return false;
  if (POSITIVE_WORDS.some(w => low.includes(w))) return true;
  return true; // default to "yes" so we don't lose an interested lead over ambiguous phrasing
}

// Maps the current flow step back to the question Heena is waiting on an answer
// for — used to gently repeat the question after answering an off-topic query.
function getCurrentQuestionText() {
  switch (flowStep) {
    case "INITIAL": return FLOW_QUESTIONS.country;
    case "COUNTRY": return FLOW_QUESTIONS.country;
    case "COURSE": return FLOW_QUESTIONS.course;
    case "NAME": return FLOW_QUESTIONS.name;
    case "TIMELINE": return FLOW_QUESTIONS.timeline;
    case "CLARIFY_TIMELINE": return FLOW_QUESTIONS.clarifyTimeline;
    case "COLLECT_MOBILE": return FLOW_QUESTIONS.askMobile;
    case "EDUCATION": return FLOW_QUESTIONS.education;
    case "PERCENTAGE": return FLOW_QUESTIONS.percentage;
    case "ENGLISH": return FLOW_QUESTIONS.english;
    case "BUDGET": return FLOW_QUESTIONS.budget;
    case "SCHEDULE_OFFER": return FLOW_QUESTIONS.scheduleOffer;
    case "SCHEDULE_TIME": return FLOW_QUESTIONS.scheduleTime;
    case "SCHEDULE_MOBILE": return FLOW_QUESTIONS.askMobile;
    case "MIDFLOW_NAME": return FLOW_QUESTIONS.name;
    case "MIDFLOW_MOBILE": return FLOW_QUESTIONS.askMobile;
    default: return "";
  }
}

// Decides which question comes next based on what we already know —
// used so country/course are never asked twice regardless of how they
// were learned (proactively asked, or picked up from the student's own words).
function nextStepAfterCountryAndCourse() {
  if (!leadAnswers.country) return "COUNTRY";
  if (!leadAnswers.course) return "COURSE";
  if (!leadAnswers.name) return "NAME";
  return "TIMELINE";
}

// Detects if the student is expressing interest in a counselling call at any
// point in the conversation (not just at the final Q9 offer) — e.g. "please
// schedule a call", "can someone call me", "connect me to a counsellor".
const SCHEDULE_REQUEST_PHRASES = [
  "schedule a call", "schedule call", "book a call", "call me", "call back",
  "callback", "talk to counsellor", "talk to a counsellor", "speak to counsellor",
  "speak to a counsellor", "connect me", "talk to your team", "talk to someone",
  "counselling call", "counseling call", "schedule counselling", "schedule counseling"
];
function isScheduleRequest(text) {
  const low = (text || "").toLowerCase();
  return SCHEDULE_REQUEST_PHRASES.some(p => low.includes(p));
}
// Steps where this reactive detection applies — the dedicated Q9 scheduling
// steps already handle this directly, so they're excluded here.
const REGULAR_PROFILE_STEPS = ["INITIAL","COUNTRY","COURSE","TIMELINE","CLARIFY_TIMELINE","EDUCATION","PERCENTAGE","ENGLISH","BUDGET"];

// ---------- Answer Validation ----------
// Checks whether a reply actually relates to the question currently being
// asked, so an unrelated message (e.g. asking about accommodation while
// Heena is waiting for an education qualification) doesn't get mistaken for
// a real answer and silently skip the question. Steps not listed here (like
// COUNTRY/COURSE, which already accept free-form answers) are always valid —
// only questions with a genuinely recognisable expected pattern are checked.
const STEP_VALIDATORS = {
  NAME: (text) => matchFAQ(text).score < 0.2,
  TIMELINE: (text) => matchFAQ(text).score < 0.2,
  CLARIFY_TIMELINE: (text) => matchFAQ(text).score < 0.2,
  EDUCATION: (text) => /\b(10th|12th|ssc|hsc|matric|diploma|bachelor|bachelors|graduate|undergraduate|postgraduate|b\.?a\.?|b\.?sc\.?|b\.?com\.?|b\.?tech|b\.?e\.?|m\.?a\.?|m\.?sc\.?|m\.?com\.?|m\.?tech|mba|mbbs|phd|intermediate|puc|degree|schooling)\b/i.test(text),
  PERCENTAGE: (text) => /\d/.test(text),
  ENGLISH: (text) => matchFAQ(text).score < 0.2,
  BUDGET: (text) => /\d|lakh|lac|crore|rs\.?|inr|\$|usd|budget/i.test(text),
  COLLECT_MOBILE: (text) => /\d{7,}/.test(text.replace(/\D/g, "")),
  SCHEDULE_MOBILE: (text) => /\d{7,}/.test(text.replace(/\D/g, ""))
};

// A few friendly, varied ways to say "that didn't answer my question" —
// picked at random so it doesn't feel robotic if it happens more than once.
const REJECTION_PHRASES = [
  "Sorry, I couldn't relate your reply to my previous question. \u{1F60A} Could you please answer that first so I can guide you accurately?",
  "Thanks for sharing that! To guide you accurately, I still need an answer to my previous question first.",
  "No worries, I just need this bit of information before we move ahead. \u{1F60A}",
  "Sorry, that doesn't seem to answer my previous question. Could you help me out with that first?"
];
function isCurrentAnswerValid(text) {
  const validator = STEP_VALIDATORS[flowStep];
  return validator ? validator(text) : true;
}
function randomRejectionPhrase() {
  return REJECTION_PHRASES[Math.floor(Math.random() * REJECTION_PHRASES.length)];
}

// A few friendly, varied ways to return to the pending counselling question
// after answering an off-topic query — picked at random so it feels natural.
const RETURN_PHRASES = [
  "I hope that answers your question! \u{1F60A} Now, coming back to where we left off -",
  "Coming back to my previous question \u{1F60A}",
  "Now, back to where we were -",
  "Hope that helps! Getting back to my earlier question -"
];
function randomReturnPhrase() {
  return RETURN_PHRASES[Math.floor(Math.random() * RETURN_PHRASES.length)];
}

// Processes the user's answer for whichever step we're currently on,
// updates state, and returns Heena's next message. Behaves like an experienced
// counsellor: never re-asks something already known, and picks up extra
// details (like a course mentioned inside the country answer) opportunistically.
function processFlowAnswer(text) {
  switch (flowStep) {

    case "INITIAL": {
      // First message from the student — analyze it for country/course before
      // asking anything, so we never ask something they've already told us.
      const loc = detectLocation(text);
      const course = detectCourse(text);
      let ack;
      if (loc && course) {
        leadAnswers.country = formatLocation(loc);
        leadAnswers.course = formatCourse(course);
        ack = `Great choice! ${leadAnswers.country} is an excellent destination for ${leadAnswers.course} studies. \u{1F60A}`;
      } else if (loc) {
        leadAnswers.country = formatLocation(loc);
        ack = `Great! ${leadAnswers.country} is an excellent study destination. \u{1F60A}`;
      } else if (course) {
        leadAnswers.course = formatCourse(course);
        ack = `That's a great choice! \u{1F60A}`;
      } else {
        ack = `Hello! \u{1F60A} Nice to meet you.`;
      }
      flowStep = nextStepAfterCountryAndCourse();
      return `${ack} ${getCurrentQuestionText()}`;
    }

    case "COUNTRY": {
      const loc = detectLocation(text) || formatLocation(text.trim());
      leadAnswers.country = loc;
      const courseFound = !leadAnswers.course ? detectCourse(text) : null;
      if (courseFound) leadAnswers.course = formatCourse(courseFound);
      flowStep = nextStepAfterCountryAndCourse();
      const ack = courseFound
        ? `Great! ${loc} is an excellent study destination. We'd be happy to help you with studying there, and noted - ${leadAnswers.course} is a great choice! \u{1F60A}`
        : `Great! ${loc} is an excellent study destination. We'd be happy to help you with studying in ${loc}.`;
      return `${ack} ${getCurrentQuestionText()}`;
    }

    case "COURSE":
      leadAnswers.course = text;
      flowStep = nextStepAfterCountryAndCourse();
      return `Great choice! \u{1F393} ${getCurrentQuestionText()}`;

    case "NAME":
      leadAnswers.name = text;
      userInfo.name = text;
      flowStep = "TIMELINE";
      return `Thank you, ${text}! ${FLOW_QUESTIONS.timeline}`;

    case "TIMELINE":
      leadAnswers.timeline = text;
      if (isTimelineClear(text)) {
        flowStep = "EDUCATION";
        return FLOW_QUESTIONS.education;
      }
      flowStep = "CLARIFY_TIMELINE";
      return FLOW_QUESTIONS.clarifyTimeline;

    case "CLARIFY_TIMELINE":
      leadAnswers.timeline = text;
      if (isTimelineClear(text)) {
        flowStep = "EDUCATION";
        return FLOW_QUESTIONS.education;
      }
      // Still unclear — name is already known by this point, so just get the
      // mobile number (if missing) then move to scheduling a call
      if (!leadAnswers.mobile) { flowStep = "COLLECT_MOBILE"; return FLOW_QUESTIONS.askMobile; }
      flowStep = "SCHEDULE_OFFER";
      return FLOW_QUESTIONS.scheduleOffer;

    case "COLLECT_MOBILE":
      leadAnswers.mobile = text;
      userInfo.mobile = text;
      flowStep = "SCHEDULE_OFFER";
      return FLOW_QUESTIONS.scheduleOffer;

    case "EDUCATION":
      leadAnswers.education = text;
      flowStep = "PERCENTAGE";
      return `Thank you for sharing that. ${FLOW_QUESTIONS.percentage}`;

    case "PERCENTAGE":
      leadAnswers.percentage = text;
      flowStep = "ENGLISH";
      return `Got it! ${FLOW_QUESTIONS.english}`;

    case "ENGLISH":
      leadAnswers.englishTest = text;
      flowStep = "BUDGET";
      return `Thanks for letting me know. ${FLOW_QUESTIONS.budget}`;

    case "BUDGET":
      leadAnswers.budget = text;
      flowStep = "SCHEDULE_OFFER";
      return `Thank you for sharing that! ${FLOW_QUESTIONS.scheduleOffer}`;

    case "SCHEDULE_OFFER":
      if (isAffirmative(text)) {
        flowStep = "SCHEDULE_TIME";
        return FLOW_QUESTIONS.scheduleTime;
      }
      flowStep = "DONE";
      flowDone = true;
      return "No problem at all! Feel free to ask me anything else about studying abroad, or reach out whenever you're ready. \u{1F60A}";

    case "SCHEDULE_TIME":
      leadAnswers.callTime = text;
      if (!leadAnswers.mobile) { flowStep = "SCHEDULE_MOBILE"; return `Perfect! ${FLOW_QUESTIONS.askMobile}`; }
      flowStep = "DONE";
      flowDone = true;
      return `Perfect! I've noted everything down - our senior counsellor will call you around "${text}". Thanks for chatting with me today! \u{1F60A}`;

    case "SCHEDULE_MOBILE":
      leadAnswers.mobile = text;
      userInfo.mobile = text;
      flowStep = "DONE";
      flowDone = true;
      return `Perfect! I've noted everything down - our senior counsellor will call you around "${leadAnswers.callTime}". Thanks for chatting with me today! \u{1F60A}`;

    case "MIDFLOW_NAME": {
      leadAnswers.name = text;
      userInfo.name = text;
      if (!leadAnswers.mobile) {
        flowStep = "MIDFLOW_MOBILE";
        return `Thank you, ${text}! ${FLOW_QUESTIONS.askMobile}`;
      }
      flowStep = pendingReturnStep || "COUNTRY";
      pendingReturnStep = null;
      return `Perfect, thank you! Our counsellor will call you shortly. Now, back to where we were - ${getCurrentQuestionText()}`;
    }

    case "MIDFLOW_MOBILE": {
      leadAnswers.mobile = text;
      userInfo.mobile = text;
      flowStep = pendingReturnStep || "COUNTRY";
      pendingReturnStep = null;
      return `Perfect, thank you! Our counsellor will call you shortly. Now, back to where we were - ${getCurrentQuestionText()}`;
    }

    default:
      return getFAQAnswer(text);
  }
}

let chatStarted = false;
let sheetRowCreated = false; // becomes true once we've created this visitor's row in the Sheet
let pendingReturnStep = null; // remembers which question to resume if the student asks to schedule a call mid-flow

launcher.addEventListener('click', () => {
  panel.classList.toggle('open');
  if (panel.classList.contains('open') && !chatStarted) {
    startChat();
  }
});
closeBtn.addEventListener('click', () => panel.classList.remove('open'));

// Chat opens directly — no pre-chat form. Greeting is shown once, the first time the panel opens.
function startChat() {
  chatStarted = true;
  addMessage('bot', `Hello \u{1F44B} How Can I Help You?`);
  conversationLog.push(`Heena: Hello \u{1F44B} How Can I Help You?`);
  // Bot now waits silently for the student's first message — see the
  // "INITIAL" case in processFlowAnswer() for how that first message is analyzed.
}

// ---------- Chat logic ----------
sendBtn.addEventListener('click', handleUserMessage);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleUserMessage(); });

function handleUserMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  const userMsgEl = addMessage('user', text);
  inputEl.value = '';
  conversationLog.push(`User: ${text}`);

  showTyping();

  // WhatsApp-style: ticks turn blue the moment Heena starts "typing" a reply
  const ticks = userMsgEl.querySelector('.ticks');
  if (ticks) ticks.classList.add('read');

  const delay = 1000 + Math.random() * 1000; // 1-2 sec realism delay
  setTimeout(() => {
    hideTyping();
    let reply;

    try {
      if (flowDone) {
        reply = getFAQAnswer(text);
      } else {
        // Detect if this looks like a genuine question about our services rather
        // than an answer to the pending counselling question — if so, answer it
        // from the knowledge base first, then gently return to where we left off.
        const faqMatch = matchFAQ(text);
        const looksLikeQuestion = text.trim().endsWith('?');
        // Country/Course answers legitimately overlap with FAQ topic keywords
        // (e.g. "MBA" is both a valid course answer AND an FAQ topic), so only
        // treat a strong FAQ-score match as an interruption outside those two
        // steps. An actual question (ending in "?") is still always caught.
        const isCountryOrCourseStep = (flowStep === "INITIAL" || flowStep === "COUNTRY" || flowStep === "COURSE");
        // Uses the same 0.2 threshold as the off-topic answer validators below —
        // otherwise a message could score too low to trigger an interruption
        // but still high enough to fail validation, getting silently rejected
        // instead of answered. Keeping both thresholds identical closes that gap.
        const isInterruption = looksLikeQuestion || (!isCountryOrCourseStep && faqMatch.score >= 0.2);

        if (REGULAR_PROFILE_STEPS.includes(flowStep) && !looksLikeQuestion && isScheduleRequest(text)) {
          // Student is asking for a call right now, mid-questionnaire — pause
          // the flow, collect name/mobile (whichever is missing), then resume.
          pendingReturnStep = flowStep;
          if (!leadAnswers.name) {
            flowStep = "MIDFLOW_NAME";
            reply = `Sure, I'd be happy to set that up! \u{1F60A} ${FLOW_QUESTIONS.name}`;
          } else if (!leadAnswers.mobile) {
            flowStep = "MIDFLOW_MOBILE";
            reply = `Sure, I'd be happy to set that up! ${FLOW_QUESTIONS.askMobile}`;
          } else {
            reply = `Great, I've noted that down - our counsellor will call you shortly! Now, back to where we were - ${getCurrentQuestionText()}`;
            pendingReturnStep = null;
          }
        } else if (isInterruption) {
          const answer = faqMatch.answer && faqMatch.score >= safeMatchThreshold() ? faqMatch.answer : safeFallbackResponse();
          const pendingQuestion = getCurrentQuestionText();
          reply = pendingQuestion ? `${answer}\n\n${randomReturnPhrase()} ${pendingQuestion}` : answer;
        } else if (!isCurrentAnswerValid(text)) {
          // Reply doesn't look like it actually answers the pending question
          // (e.g. "accommodation assistance" while waiting for a qualification).
          // Don't advance the flow — politely ask again instead.
          reply = `${randomRejectionPhrase()} ${getCurrentQuestionText()}`;
        } else {
          reply = processFlowAnswer(text);
        }
      }
    } catch (err) {
      // Safety net: never leave the user with a blank/stuck chat. If anything
      // unexpected throws, log it for debugging and recover gracefully instead
      // of going silent, then re-ask whatever question was pending.
      console.error('Heena chatbot: error generating reply', err);
      const pendingQuestion = getCurrentQuestionText();
      reply = pendingQuestion
        ? `Sorry, I missed that - could you say that again? ${pendingQuestion}`
        : "Sorry, I missed that - could you say that again?";
    }

    addMessage('bot', reply);
    conversationLog.push(`Heena: ${reply}`);

    // Once we have a mobile number, create the Sheet row (once) and keep
    // updating its conversation summary on every turn after that.
    if (leadAnswers.mobile && !sheetRowCreated) {
      sheetRowCreated = true;
      sendToSheet({
        action: 'saveLead',
        name: leadAnswers.name,
        mobile: leadAnswers.mobile,
        conversationSummary: buildSummary()
      });
    } else if (sheetRowCreated) {
      syncConversation();
    }
  }, delay);
}

// Builds a short, natural-language summary of the student's profile so far —
// matches the style requested for the Google Sheet "Summary" column, e.g.
// "Interested in MBA in Ireland. Planning for September 2027 intake.
//  Bachelor's in Computer Science with 72%. IELTS 6.5. Budget Rs 20-25 Lakhs.
//  Counselling call requested."
function buildSummary() {
  const parts = [];
  if (leadAnswers.course || leadAnswers.country) {
    const courseText = leadAnswers.course ? leadAnswers.course : "a course";
    const countryText = leadAnswers.country ? ` in ${leadAnswers.country}` : "";
    parts.push(`Interested in ${courseText}${countryText}.`);
  }
  if (leadAnswers.timeline) parts.push(`Planning for ${leadAnswers.timeline} intake.`);
  if (leadAnswers.education) {
    const pct = leadAnswers.percentage ? ` with ${leadAnswers.percentage}` : "";
    parts.push(`${leadAnswers.education}${pct}.`);
  }
  if (leadAnswers.englishTest) parts.push(`English test: ${leadAnswers.englishTest}.`);
  if (leadAnswers.budget) parts.push(`Budget ${leadAnswers.budget}.`);
  if (leadAnswers.callTime) {
    parts.push(`Counselling call requested for ${leadAnswers.callTime}.`);
  } else if (flowStep && flowStep.indexOf("SCHEDULE") === 0) {
    parts.push("Counselling call requested.");
  }
  return parts.length ? parts.join(' ') : "Conversation in progress.";
}

function addMessage(sender, text) {
  const div = document.createElement('div');
  div.className = `heena-msg ${sender}`;

  const textSpan = document.createElement('span');
  textSpan.textContent = text;
  div.appendChild(textSpan);

  if (sender === 'user') {
    const ticks = document.createElement('span');
    ticks.className = 'ticks';
    ticks.innerHTML = `<svg viewBox="0 0 20 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 6.5L4.5 10L11 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 6.5L9.5 10L16 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
    div.appendChild(ticks);
  }

  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'heena-typing';
  div.id = 'heena-typing-indicator';
  div.innerHTML = 'Heena is typing <span class="heena-dots"><span></span><span></span><span></span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping() {
  const el = document.getElementById('heena-typing-indicator');
  if (el) el.remove();
}

// ---------- FAQ Matching ----------
// Defensive fallbacks: if faq-data.js fails to load for any reason (wrong
// path, 404, blocked script, hosting misconfiguration), these prevent the
// ENTIRE chat from crashing on every single message. The guided question
// flow does not actually depend on faq-data.js at all — only the optional
// "answer knowledge-base questions" feature does, and that now degrades
// gracefully instead of taking the whole conversation down with it.
function safeFaqData() {
  return (typeof FAQ_DATA !== 'undefined' && Array.isArray(FAQ_DATA)) ? FAQ_DATA : [];
}
function safeFallbackResponse() {
  return (typeof FALLBACK_RESPONSE !== 'undefined' && FALLBACK_RESPONSE)
    ? FALLBACK_RESPONSE
    : "That's a great question. One of our expert counsellors can guide you better on this. Would you like me to schedule a counselling call for you?";
}
function safeMatchThreshold() {
  return (typeof MATCH_THRESHOLD !== 'undefined' && typeof MATCH_THRESHOLD === 'number') ? MATCH_THRESHOLD : 0.2;
}

// Escapes regex special characters in a keyword before building a boundary pattern.
function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function matchFAQ(userText) {
  const text = (userText || "").toLowerCase();
  const data = safeFaqData();

  // Checks each FAQ entry in order (specific per-country entries are listed
  // before the generic ones in faq-data.js) and returns the FIRST one where
  // at least one of its keyword phrases fully matches. Using "any keyword
  // matched" instead of "fraction of keywords matched" means an entry with
  // many alternate phrasings isn't penalized just for having more variants.
  for (let i = 0; i < data.length; i++) {
    const item = data[i];
    const matched = (item.keywords || []).some(kw => {
      const words = kw.toLowerCase().split(/\s+/);
      return words.every(w => new RegExp('\\b' + escapeRegExp(w) + '\\b').test(text));
    });
    if (matched) {
      return { score: 1, answer: item.answer };
    }
  }

  return { score: 0, answer: null };
}

function getFAQAnswer(userText) {
  const match = matchFAQ(userText);
  if (match.answer && match.score >= safeMatchThreshold()) {
    return match.answer;
  }
  return safeFallbackResponse();
}

// ---------- Google Sheet Sync ----------
async function sendToSheet(payload) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('PASTE_YOUR')) {
    console.warn('Heena chatbot: Apps Script URL not configured yet.');
    return;
  }
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      // text/plain avoids CORS preflight issues with Apps Script Web Apps
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
  } catch (err) {
    console.error('Heena chatbot: failed to sync with Google Sheet', err);
  }
}

function syncConversation() {
  if (!userInfo.mobile) return; // safety guard; sheetRowCreated already ensures this is set
  sendToSheet({
    action: 'updateConversation',
    mobile: userInfo.mobile,
    conversationSummary: buildSummary()
  });
}
</script>
